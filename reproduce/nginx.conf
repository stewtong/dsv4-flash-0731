# Reference session-affinity load balancer for the DP8 per-rank engines.
#
# The engine runs --data-parallel-multi-port-external-lb --port 8100, so it
# publishes one API server per DP rank, each with its own independent prefix
# cache, on 127.0.0.1:8100 through 8107. This nginx sits in front of those
# eight entries and keeps one conversation on one rank so the rank holds the
# conversation's prefix across turns. The same design must be reproduced by
# any proxy that replaces this reference (Envoy, HAProxy, Caddy, or another
# nginx), or session locality silently degrades to a warm/cold coin flip.
#
# What is load-bearing here, and what any replacement must reproduce:
#   - Binding the engines loopback-only; this proxy is the only route to them.
#   - Stable session-to-rank placement (consistent hash), with an explicit
#     X-data-parallel-rank override and round-robin for unkeyed traffic.
#   - Stripping X-data-parallel-rank before the engine, because in per-rank
#     external-LB mode every rank sees data-parallel-size 1 and rejects an
#     out-of-range rank header with HTTP 400.
#   - proxy_http_version 1.1, streaming (proxy_buffering off), and long
#     send/read timeouts for long-context turns.
#   - No body-size cap (client_max_body_size 0) so that multi-hundred-thousand
#     token contexts are admitted; nginx's default 1 MB cap rejects a 256K-token
#     request with HTTP 413, an observed failure mode on this shape.
#   - No automatic retry or re-route of an inference POST after dispatch.
#
# This file binds 127.0.0.1:8000. Put an authenticated, TLS-facing front door in
# front of it (see nginx-ingress.conf); do not expose these loopback listeners on
# the public network directly.

worker_processes auto;
events { worker_connections 4096; }
http {
    map_hash_bucket_size 256;
    map_hash_max_size 2048;
    access_log off;

    # 1. Explicit rank from a trusted loopback caller. nginx-ingress.conf always
    #    clears an external client's copy before forwarding a request here.
    #    Sanitised through a map so only 0-7 can select.
    map $http_x_data_parallel_rank $rank_target {
        default   "";
        "0" "rank0"; "1" "rank1"; "2" "rank2"; "3" "rank3";
        "4" "rank4"; "5" "rank5"; "6" "rank6"; "7" "rank7";
    }
    # 2. Otherwise consistent-hash on the strongest session identity available:
    #    explicit session id -> Claude session/agent id -> per-user key label.
    map "$http_x_claude_code_session_id|$http_x_claude_code_agent_id" $claude_sess {
        default   "$http_x_claude_code_session_id|$http_x_claude_code_agent_id";
        "|"       "";
    }
    map $http_x_session_id $sess1 { default $http_x_session_id; "" $claude_sess; }
    map $sess1 $sess2 { default $sess1; "" $http_x_session_key; }
    # No session identity resolvable: fall back to round-robin, NOT a hash on the
    # peer address. Behind a front-door proxy every peer is a loopback address, so
    # hashing on it would pin all unkeyed traffic to one rank and serialise it.
    map $sess2 $has_key { default "1"; "" ""; }
    map $sess2 $lbkey { default $sess2; "" "-"; }

    map "$rank_target|$has_key" $target {
        default        "ranks_hash";
        "|"            "ranks_rr";
        "|1"           "ranks_hash";
        "rank0|"  "rank0"; "rank0|1" "rank0";
        "rank1|"  "rank1"; "rank1|1" "rank1";
        "rank2|"  "rank2"; "rank2|1" "rank2";
        "rank3|"  "rank3"; "rank3|1" "rank3";
        "rank4|"  "rank4"; "rank4|1" "rank4";
        "rank5|"  "rank5"; "rank5|1" "rank5";
        "rank6|"  "rank6"; "rank6|1" "rank6";
        "rank7|"  "rank7"; "rank7|1" "rank7";
    }

    upstream rank0 { server 127.0.0.1:8100; keepalive 8; }
    upstream rank1 { server 127.0.0.1:8101; keepalive 8; }
    upstream rank2 { server 127.0.0.1:8102; keepalive 8; }
    upstream rank3 { server 127.0.0.1:8103; keepalive 8; }
    upstream rank4 { server 127.0.0.1:8104; keepalive 8; }
    upstream rank5 { server 127.0.0.1:8105; keepalive 8; }
    upstream rank6 { server 127.0.0.1:8106; keepalive 8; }
    upstream rank7 { server 127.0.0.1:8107; keepalive 8; }
    upstream ranks_rr {
        server 127.0.0.1:8100; server 127.0.0.1:8101;
        server 127.0.0.1:8102; server 127.0.0.1:8103;
        server 127.0.0.1:8104; server 127.0.0.1:8105;
        server 127.0.0.1:8106; server 127.0.0.1:8107;
        keepalive 16;
    }
    upstream ranks_hash {
        # Consistent hash: stable placement across restarts and rebalancing.
        hash $lbkey consistent;
        server 127.0.0.1:8100; server 127.0.0.1:8101;
        server 127.0.0.1:8102; server 127.0.0.1:8103;
        server 127.0.0.1:8104; server 127.0.0.1:8105;
        server 127.0.0.1:8106; server 127.0.0.1:8107;
    }

    server {
        listen 127.0.0.1:8000;
        # Keep large long-context bodies. nginx's default 1 MB cap rejects a
        # 256K-token request (about 1.31 MB) with 413; the reference sets no cap.
        client_max_body_size 0;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 15s;
        proxy_set_header Connection "";
        # A dispatched inference POST must not move to another rank or replay
        # after a dispatch; disable upstream retry so a failed request is not
        # silently duplicated.
        proxy_next_upstream off;
        proxy_next_upstream_tries 1;

        location / {
            # Affinity headers select an upstream only. Do not disclose user or
            # session identity to the engine, and do not pass the rank header to
            # a per-rank API process whose local dp_size is 1.
            proxy_set_header X-data-parallel-rank "";
            proxy_set_header X-Claude-Code-Session-Id "";
            proxy_set_header X-Claude-Code-Agent-Id "";
            proxy_set_header X-Claude-Code-Parent-Agent-Id "";
            proxy_set_header X-Session-Id "";
            proxy_set_header X-Session-Key "";
            proxy_pass http://$target;
        }
    }
}
