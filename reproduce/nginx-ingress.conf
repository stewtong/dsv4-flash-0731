# Reference authenticated ingress in front of nginx.conf (the session-affinity
# load balancer) or, for a topology without affinity, directly in front of the
# engine. It terminates TLS at the edge, authenticates bearer keys, enforces an
# exact-match route allowlist, applies per-key policy, and writes a metadata-only
# access log. It injects a single internal upstream key and never logs request or
# response content.
#
# This is a reference implementation of required behaviour, not a product
# dependency. Any proxy that reproduces authenticated ingress, the route
# allowlist, streaming delivery, the body-size policy, and per-key limits can
# replace it.
#
# Security contract:
#   - Store no real keys in this file or this repository. The per-user key map
#     and the internal upstream key live in /etc/nginx/keys/keys.conf
#     (root-only) and are included below.
#   - The internal upstream key must never be logged. The access log records
#     route, status and sizes only.
#   - proxy_http_version 1.1 and proxy_buffering off preserve SSE delivery.
#   - The 8-in-flight-per-key value below is a gateway policy, not a limit of
#     vLLM or the GPU.

worker_processes auto;
events { worker_connections 4096; }
http {
    # Per-user key map and the internal upstream key. Define them here or in a
    # root-only file:
    #   map $http_authorization $user_label {
    #       default "unknown";
    #       "Bearer <user-key>" "alice";
    #       "Bearer <user-key>" "bob";
    #   }
    #   map "" $internal_bearer { default "Bearer <your-deploy-key>"; }
    include /etc/nginx/keys/keys.conf;

    # Per-key concurrency policy: 8 in-flight requests per user. This is policy
    # at the gateway; it is not an engine or GPU concurrency limit.
    limit_conn_zone $user_label zone=peruser:10m;
    limit_conn_status 429;

    log_format meta '$remote_addr $request_method $uri $status $request_length $bytes_sent $user_label';
    access_log /var/log/nginx/access.log meta;

    upstream vllm { server 127.0.0.1:8000; keepalive 16; }

    server {
        listen 127.0.0.1:8443 ssl;
        ssl_certificate     /etc/nginx/certs/serve.crt;   # your public certificate
        ssl_certificate_key /etc/nginx/certs/serve.key;   # your private key, root-only
        listen 127.0.0.1:8080;                            # cleartext loopback path

        client_max_body_size 0;          # admit long-context bodies (see nginx.conf note)
        proxy_http_version 1.1;
        proxy_buffering off;             # preserve SSE streamed delivery
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 15s;
        # A dispatched inference request must not be re-sent to another upstream.
        proxy_next_upstream off;
        proxy_next_upstream_tries 1;

        # Authenticated API routes, exact match. An unknown bearer is rejected
        # before proxying; the internal upstream key is injected and the client's
        # credentials are not forwarded.
        location = /v1/chat/completions {
            if ($user_label = "unknown") { return 401; }
            limit_conn peruser 8;
            proxy_set_header Authorization $internal_bearer;
            proxy_set_header X-Api-Key "";
            proxy_set_header X-data-parallel-rank "";
            proxy_set_header X-Session-Key $user_label;
            proxy_pass http://vllm;
        }
        location = /v1/completions {
            if ($user_label = "unknown") { return 401; }
            limit_conn peruser 8;
            proxy_set_header Authorization $internal_bearer;
            proxy_set_header X-Api-Key "";
            proxy_set_header X-data-parallel-rank "";
            proxy_set_header X-Session-Key $user_label;
            proxy_pass http://vllm;
        }
        location = /v1/messages {
            if ($user_label = "unknown") { return 401; }
            limit_conn peruser 8;
            proxy_set_header Authorization $internal_bearer;
            proxy_set_header X-Api-Key "";
            proxy_set_header X-data-parallel-rank "";
            proxy_set_header X-Session-Key $user_label;
            proxy_pass http://vllm;
        }
        location = /v1/messages/count_tokens {
            if ($user_label = "unknown") { return 401; }
            limit_conn peruser 8;
            proxy_set_header Authorization $internal_bearer;
            proxy_set_header X-Api-Key "";
            proxy_set_header X-data-parallel-rank "";
            proxy_set_header X-Session-Key $user_label;
            proxy_pass http://vllm;
        }
        location = /v1/models {
            if ($user_label = "unknown") { return 401; }
            limit_conn peruser 8;
            proxy_set_header Authorization $internal_bearer;
            proxy_set_header X-Api-Key "";
            proxy_set_header X-data-parallel-rank "";
            proxy_set_header X-Session-Key $user_label;
            proxy_pass http://vllm;
        }
        # Liveness only, unauthenticated; never a model call.
        location = /health {
            proxy_pass http://vllm;
        }
        # Everything else is rejected, even with a valid key.
        location / {
            return 404;
        }
    }
}
